spring.profiles.active=@spring.profiles.active@

spring.mail.host=${MAIL_HOST:smtp.office365.com}
spring.mail.username=${MAIL_USERNAME:noreply@mawa.co.za}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=${MAIL_FROM:noreply@mawa.co.za}
spring.mail.properties.mail.smtp.port=${spring.mail.port}
spring.mail.properties.mail.transport.protocol=smtps
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.socketFactory.fallback=true
spring.mail.properties.mail.mail.debug=${MAIL_DEBUG:false}
mail.from.name=${MAIL_FROM_NAME:Mawa}
#server.port=8010

# Google Secret Manager bootstrap
# Enable in Cloud Run using environment variables instead of hard-coding secrets here:
# GCP_SECRET_ENABLED=true
# GCP_PROJECT_ID=mawa-162022
# GCP_SECRET_MAPPINGS=jwt.secret=mawa-dev-jwt-secret,hibernate.connection.url=mawa-dev-db-url,hibernate.connection.username=mawa-dev-db-username,hibernate.connection.password=mawa-dev-db-password,spring.datasource.url=mawa-dev-db-url,spring.datasource.username=mawa-dev-db-username,spring.datasource.password=mawa-dev-db-password,flyway.url=mawa-dev-db-url,flyway.user=mawa-dev-db-username,flyway.password=mawa-dev-db-password,spring.mail.password=mawa-mail-password,mawa.admin.api.password=mawa-admin-api-password
#
# The Secret Manager property source is loaded before Spring creates datasource/JWT/mail beans.
gcp.secret-manager.enabled=${GCP_SECRET_ENABLED:false}
gcp.secret-manager.project-id=${GCP_PROJECT_ID:}
gcp.secret-manager.mappings=${GCP_SECRET_MAPPINGS:}
