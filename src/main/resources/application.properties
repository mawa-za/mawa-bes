# Runtime profile selection. Cloud Run should set SPRING_PROFILES_ACTIVE explicitly.
# Dev is the safe fallback for local builds and non-configured development services.
spring.profiles.default=dev

spring.mail.host=${MAIL_HOST:smtp.office365.com}
spring.mail.username=${MAIL_USERNAME:noreply@mawa.co.za}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=${MAIL_FROM:noreply@mawa.co.za}
spring.mail.properties.mail.smtp.port=${spring.mail.port}
spring.mail.properties.mail.transport.protocol=smtps
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.socketFactory.fallback=true
spring.mail.properties.mail.mail.debug=${MAIL_DEBUG:false}
mail.from.name=${MAIL_FROM_NAME:Mawa}
#server.port=8010

# Google Secret Manager bootstrap
# Enable in Cloud Run using environment variables instead of hard-coding secrets here:
# GCP_SECRET_ENABLED=true
# GCP_PROJECT_ID=mawa-162022
# GCP_SECRET_MAPPINGS=jwt.secret=mawa-dev-jwt-secret,mawa.encryption.secret=mawa-dev-encryption-secret,hibernate.connection.url=mawa-dev-db-url,hibernate.connection.username=mawa-dev-db-username,hibernate.connection.password=mawa-dev-db-password,spring.datasource.url=mawa-dev-db-url,spring.datasource.username=mawa-dev-db-username,spring.datasource.password=mawa-dev-db-password,spring.mail.password=mawa-mail-password,mawa.internal.service-token=mawa-dev-internal-service-token,mawa.admin.api.password=mawa-admin-api-password
#
# The Secret Manager property source is loaded before Spring creates datasource/JWT/mail beans.
gcp.secret-manager.enabled=${GCP_SECRET_ENABLED:false}
gcp.secret-manager.project-id=${GCP_PROJECT_ID:}
gcp.secret-manager.mappings=${GCP_SECRET_MAPPINGS:}

# mawa-admin-bes calls /internal/admin/** using X-Mawa-Internal-Token.
# Set MAWA_INTERNAL_SERVICE_TOKEN to the same secret value on mawa-admin-bes and mawa-bes.
# mawa-bes uses the reverse /internal/erp/** contract for tenant discovery.
mawa.admin.api.connect-timeout-ms=${MAWA_ADMIN_API_CONNECT_TIMEOUT_MS:5000}
mawa.admin.api.read-timeout-ms=${MAWA_ADMIN_API_READ_TIMEOUT_MS:15000}
mawa.admin.api.tenant-cache-ttl-ms=${MAWA_ADMIN_TENANT_CACHE_TTL_MS:60000}

mawa.scheduler.enabled=${MAWA_SCHEDULER_ENABLED:true}
mawa.scheduler.transient-db-retry-attempts=${MAWA_SCHEDULER_DB_RETRY_ATTEMPTS:2}
mawa.scheduler.transient-db-retry-backoff-ms=${MAWA_SCHEDULER_DB_RETRY_BACKOFF_MS:500}

# Cloud Run instances can retain pooled connections longer than an upstream
# network path or Cloud SQL proxy keeps them alive. Proactively retire and
# keep connections healthy so scheduled jobs do not receive stale sockets.
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:540000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_TIME_MS:120000}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}

# Avoid database access during response serialization and remove the Spring
# Boot startup warning. Service methods own their transaction boundaries.
spring.jpa.open-in-view=false

# Compress paged JSON master-data responses. Dio transparently decompresses
# gzip responses, reducing first-snapshot transfer size and mobile data usage.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/problem+json,text/plain,text/html,text/xml,text/css,application/javascript

# Password recovery: opaque single-use tokens (30 minutes by default).
mawa.password-reset.expiration-ms=${MAWA_PASSWORD_RESET_EXPIRATION_MS:1800000}
mawa.password-reset.rate-limit.email-per-hour=${MAWA_PASSWORD_RESET_EMAIL_RATE_LIMIT:5}
mawa.password-reset.rate-limit.ip-per-hour=${MAWA_PASSWORD_RESET_IP_RATE_LIMIT:20}
mawa.password-reset.minimum-password-length=${MAWA_PASSWORD_RESET_MINIMUM_PASSWORD_LENGTH:8}

# Central billing service
mawa.billing.base-url=${MAWA_BILLING_BASE_URL:http://localhost:8085}
mawa.billing.entitlement-enforcement-enabled=${MAWA_BILLING_ENTITLEMENT_ENFORCEMENT_ENABLED:true}
mawa.billing.entitlement-cache-seconds=${MAWA_BILLING_ENTITLEMENT_CACHE_SECONDS:30}
mawa.billing.connect-timeout-ms=${MAWA_BILLING_CONNECT_TIMEOUT_MS:2000}
mawa.billing.read-timeout-ms=${MAWA_BILLING_READ_TIMEOUT_MS:3000}

# Database migrations are owned exclusively by mawa-flyway-runner.
spring.flyway.enabled=false
# Cloud Run health probes. Only health and info are exposed.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

