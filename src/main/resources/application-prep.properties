application.version=@project.version@
jwt.secret=${JWT_SECRET:}
# Separate encryption key used for existing encrypted passwords/tenant DB passwords.
# Keep this equal to the old pre-rotation jwt.secret until encrypted data is migrated/reset.
mawa.encryption.secret=${ENCRYPTION_SECRET:${jwt.secret}}
jwt.expirationDateInMs=90000000
jwt.refreshExpirationDateInMs=90000000

springdoc.packagesToScan=za.co.mawa.bes
springdoc.paths-to-match=/**

spring.jpa.properties.hibernate.multiTenancy=TENANT
#spring.jpa.properties.hibernate.tenant_identifier_resolver=za.co.mawa.bes.configuration.hibernate.TenantIdentifierResolver
#spring.jpa.properties.hibernate.multi_tenant_connection_provider=za.co.mawa.bes.configuration.hibernate.TenantConnectionProvider

spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# Runtime database settings. Do not commit real database hosts, usernames or passwords.
# In Cloud Run these values should be provided by environment variables and/or Google Secret Manager.
hibernate.connection.url=${DB_URL:}
hibernate.default_schema=${DB_SCHEMA:mawa}
hibernate.connection.username=${DB_USERNAME:}
hibernate.connection.password=${DB_PASSWORD:}
hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver
hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.datasource.url=${hibernate.connection.url}
spring.datasource.username=${hibernate.connection.username}
spring.datasource.password=${hibernate.connection.password}
spring.datasource.driver-class-name=${hibernate.connection.driver_class}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=${hibernate.dialect}
spring.jpa.properties.hibernate.default_schema=${hibernate.default_schema}
spring.jpa.database-platform=${hibernate.dialect}
#spring.jpa.show-sql=true
spring.jpa.generate-ddl=false

flyway.url=${hibernate.connection.url}
flyway.user=${hibernate.connection.username}
flyway.password=${hibernate.connection.password}

# MAWA custom Flyway runner.
# API service default is disabled. Use the dedicated Cloud Run Job / migration command to run Flyway.
# For emergency API-side migration only, explicitly set MAWA_FLYWAY_STARTUP_ENABLED=true and MAWA_FLYWAY_STARTUP_MODE=async or blocking.
mawa.flyway.startup.enabled=${MAWA_FLYWAY_STARTUP_ENABLED:false}
mawa.flyway.startup.mode=${MAWA_FLYWAY_STARTUP_MODE:disabled}
mawa.flyway.default-schema.enabled=${MAWA_FLYWAY_DEFAULT_SCHEMA_ENABLED:true}
mawa.flyway.tenant-schemas.enabled=${MAWA_FLYWAY_TENANT_SCHEMAS_ENABLED:true}
mawa.flyway.continue-on-error=${MAWA_FLYWAY_CONTINUE_ON_ERROR:false}
mawa.flyway.repair-failed=${MAWA_FLYWAY_REPAIR_FAILED:false}
mawa.flyway.baseline-on-migrate=${MAWA_FLYWAY_BASELINE_ON_MIGRATE:true}
mawa.flyway.max-tenant-errors=${MAWA_FLYWAY_MAX_TENANT_ERRORS:0}
mawa.flyway.job.enabled=${MAWA_FLYWAY_JOB_ENABLED:false}
mawa.flyway.job.exit-on-complete=${MAWA_FLYWAY_JOB_EXIT_ON_COMPLETE:true}


mawa.admin.api.url=${MAWA_ADMIN_API_URL:https://prep.admin.api.app.mawa.co.za}
mawa.admin.api.username=${MAWA_ADMIN_API_USERNAME:admin}
mawa.admin.api.password=${MAWA_ADMIN_API_PASSWORD:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# Attachment file storage. Database stores only object path/metadata; file bytes are stored in Google Cloud Storage.
mawa.attachments.storage.provider=${MAWA_ATTACHMENT_STORAGE_PROVIDER:GCP}
mawa.attachments.storage.bucket=${MAWA_ATTACHMENT_BUCKET:}
mawa.attachments.storage.prefix=${MAWA_ATTACHMENT_PREFIX:attachments}

# Admin console handoff/internals.
mawa.erp.app.url=${MAWA_ERP_APP_URL:https://prep.app.mawa.co.za}
mawa.internal.service-token=${MAWA_INTERNAL_SERVICE_TOKEN:}
mawa.admin.handoff.username=${MAWA_ADMIN_HANDOFF_USERNAME:system}
mawa.admin.handoff.ttl-ms=${MAWA_ADMIN_HANDOFF_TTL_MS:300000}
